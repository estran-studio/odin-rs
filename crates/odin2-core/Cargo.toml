[package]
name = "odin2-core"
version.workspace = true
edition.workspace = true
description = "Odin 2 synthesizer core DSP engine in Rust"
license.workspace = true
repository.workspace = true

[lib]
crate-type = ["lib"]

[[bin]]
name = "odin2-demo"
path = "src/bin/demo.rs"
required-features = ["std"]

[[bin]]
name = "morph-demo"
path = "src/bin/morph_demo.rs"
required-features = ["std"]

[[example]]
name = "audit_presets"
required-features = ["std"]

[[example]]
name = "preset_morph"
required-features = ["std"]

[[example]]
name = "fidelity_render"
required-features = ["std"]

[features]
default = []
std = ["hound"]

[dependencies]
libm.workspace = true
hound = { workspace = true, optional = true }

[dev-dependencies]
hound.workspace = true
